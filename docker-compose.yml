services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-postgres}
      TOKENS_FILE_PATH: /app/config/tokens.json
      ALCHEMY_KEY: "${ALCHEMY_KEY:?ALCHEMY_KEY must be set in .env}"
      INFURA_KEY: "${INFURA_KEY:?INFURA_KEY must be set in .env}"
      DECIDER_PROVER_URL: http://host.docker.internal:8081
      DECIDER_PROVER_TIMEOUT_SECS: 600
      ROOT_SUBMITTER_PRIVATE_KEY: "${ROOT_SUBMITTER_PRIVATE_KEY:?ROOT_SUBMITTER_PRIVATE_KEY must be set in .env}"
      IS_SYNC: "true"
      LISTEN_ADDR: 0.0.0.0:8080
      ROOT_ARTIFACTS_DIR: /app/nova_artifacts
      ROOT_INTERVAL_MS: 30000
      ROOT_SUBMIT_INTERVAL_MS: 60000
      RUST_LOG: zerc20_tree_indexer=info,folding_schemes=warn
    ports:
      - "${INDEXER_HOST_PORT:-8080}:8080"
    volumes:
      - ./nova_artifacts:/app/nova_artifacts:ro
      - "${TOKENS_FILE_PATH:?TOKENS_FILE_PATH must be set in .env}:/app/config/tokens.json:ro"

  crosschain-job:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: crosschain-job
    restart: unless-stopped
    environment:
      TOKENS_FILE_PATH: /app/config/tokens.json
      ALCHEMY_KEY: "${ALCHEMY_KEY:?ALCHEMY_KEY must be set in .env}"
      INFURA_KEY: "${INFURA_KEY:?INFURA_KEY must be set in .env}"
      RELAY_PRIVATE_KEY: "${RELAY_PRIVATE_KEY:?RELAY_PRIVATE_KEY must be set in .env}"
      RELAY_INTERVAL_SECS: "60"
      BROADCAST_INTERVAL_SECS: "60"
      RELAY_OPTIONS: 0x00030100110100000000000000000000000000030d40
      BROADCAST_OPTIONS: 0x00030100110100000000000000000000000000030d40
      RUST_LOG: info
    volumes:
      - "${TOKENS_FILE_PATH:?TOKENS_FILE_PATH must be set in .env}:/app/config/tokens.json:ro"

  fee-manager:
    profiles:
      - fee-manager
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: fee-manager
    restart: unless-stopped
    environment:
      TOKENS_FILE_PATH: /app/config/tokens.json
      ALCHEMY_KEY: "${ALCHEMY_KEY:?ALCHEMY_KEY must be set in .env}"
      INFURA_KEY: "${INFURA_KEY:?INFURA_KEY must be set in .env}"
      FEE_MANAGER_PRIVATE_KEY: "${FEE_MANAGER_PRIVATE_KEY:?FEE_MANAGER_PRIVATE_KEY must be set in .env}"
      FEE_MANAGER_INTERVAL_SECS: "${FEE_MANAGER_INTERVAL_SECS:-3600}"
      FEE_MANAGER_K_BPS: "${FEE_MANAGER_K_BPS:-1000}"
      RUST_LOG: info
    volumes:
      - "${TOKENS_FILE_PATH:?TOKENS_FILE_PATH must be set in .env}:/app/config/tokens.json:ro"

  watcher:
    profiles:
      - watcher
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: watcher
    restart: unless-stopped
    environment:
      WATCHER_CONFIG_PATH: /app/config/watcher.yaml
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      ALCHEMY_KEY: "${ALCHEMY_KEY:?ALCHEMY_KEY must be set in .env}"
      INFURA_KEY: "${INFURA_KEY:?INFURA_KEY must be set in .env}"
      RUST_LOG: info
    volumes:
      - "${WATCHER_CONFIG_PATH:-./config/watcher.yaml}:/app/config/watcher.yaml:ro"

  relay:
    profiles:
      - relay
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: relay
    restart: unless-stopped
    environment:
      TOKENS_FILE_PATH: /app/config/tokens.json
      ALCHEMY_KEY: "${ALCHEMY_KEY:?ALCHEMY_KEY must be set in .env}"
      INFURA_KEY: "${INFURA_KEY:?INFURA_KEY must be set in .env}"
      RELAYER_PRIVATE_KEY: "${RELAYER_PRIVATE_KEY:?RELAYER_PRIVATE_KEY must be set in .env}"
      RELAY_PORT: "${RELAY_PORT:-3000}"
      SWAP_ENABLED: "${SWAP_ENABLED:-true}"
      SWAP_FEE_BPS: "${SWAP_FEE_BPS:-50}"
      ORACLE_RPC_URL: "${ORACLE_RPC_URL:-}"
      RUST_LOG: info
    ports:
      - "${RELAY_HOST_PORT:-3000}:${RELAY_PORT:-3000}"
    volumes:
      - "${TOKENS_FILE_PATH:?TOKENS_FILE_PATH must be set in .env}:/app/config/tokens.json:ro"

volumes:
  postgres-data:
