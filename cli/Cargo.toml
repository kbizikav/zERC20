[package]
name = "zerc20-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
client-common = { path = "../client-common", package = "zerc20-client-common" }
zkp = { path = "../zkp", package = "zerc20-zkp" }
api-types = { path = "../api-types", package = "zerc20-api-types" }
stealth_client = { path = "../zstorage/frontend", package = "zerc20-stealth-client" }
ic-agent = { workspace = true }
candid = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
key_manager = { path = "../zstorage/backend/key_manager", package = "zerc20-key-manager" }
storage = { path = "../zstorage/backend/storage", package = "zerc20-storage" }
anyhow = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
tokio = { workspace = true, features = ["full"] }
alloy = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
num-bigint = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
reqwest = { workspace = true }
folding-schemes = { workspace = true }
ark-serialize = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
