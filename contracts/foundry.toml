[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./config" }]
ignored_warnings_from = ["dependencies/"]

[profile.ci]
ignored_warnings_from = ["dependencies/"]

[profile.ci]
src = "src"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./config" }]

[lint]
ignore = ["src/verifiers/*"]

[fmt]
ignore = ["src/verifiers/*"]


[dependencies]
"@openzeppelin-contracts" = "5.6.0-rc.0"
"@openzeppelin-contracts-upgradeable" = "5.6.0-rc.0"
"@layerzerolabs-oapp-evm-upgradeable" = "0.1.3"
"@layerzerolabs-oft-evm-upgradeable" = "4.0.2"
poseidon-solidity = "0.0.5"
"@layerzerolabs-test-devtools-evm-foundry" = "8.0.1"
"@layerzerolabs-lz-evm-protocol-v2" = "3.0.152"
forge-std = "1.14.0"
"@layerzerolabs-oft-evm" = "4.0.1"
"@layerzerolabs-oapp-evm" = "0.4.1"
"@layerzerolabs-lz-evm-messagelib-v2" = "3.0.152"
gnsps-solidity-bytes-utils = "0.8.4"
"@layerzerolabs-lz-evm-v1-0-7" = "3.0.152"
lz-address-book = { version = "1.0.0", git = "https://github.com/LayerZero-Labs/lz-address-book.git", branch = "main" }
solady = "0.1.8"

[rpc_endpoints]
al-arb-sep = "https://arb-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
al-base-sep = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
al-op-sep = "https://opt-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
al-sep = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
al-bnb-test = "https://bnb-testnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
al-arb-main = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
al-base-main = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
al-op-main = "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
al-main = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
al-bnb-main = "https://bnb-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
localhost = "http://localhost:8545"
