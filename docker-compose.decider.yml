# PostgreSQL for decider prover
# NOTE: Do not add the decider prover itself to docker compose.
#       It crashes during proof generation, so run it directly on the host.
services:
  postgres-decider:
    image: ghcr.io/pgmq/pg16-pgmq:v1.7.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DECIDER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_DECIDER_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DECIDER_DB:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-decider-data:/var/lib/postgresql/data

volumes:
  postgres-decider-data:
