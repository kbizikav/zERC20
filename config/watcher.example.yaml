discord_webhook_url: "${DISCORD_WEBHOOK_URL}"
interval_seconds: 60

# Domain 1: Balance monitoring
accounts:
  - name: mainnet_fee_manager
    address: "0xAAFC..."
    required_balance: "0.01"
    chains: [ethereum, base, arbitrum]

chains:
  ethereum:
    rpc_url: "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
    explorer: "https://etherscan.io/address/"
  base:
    rpc_url: "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
    explorer: "https://basescan.org/address/"
  arbitrum:
    rpc_url: "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
    explorer: "https://arbiscan.io/address/"

# Domain 2: Indexer monitoring
indexer:
  status_url: "http://localhost:8080/indexer/status"
  stale_threshold_cycles: 5
  max_index_gap: 100

# Domain 3: Crosschain monitoring
crosschain:
  token_config_paths:
    - "config/deployed/mainnet/tokens.zeth.mainnet.json"
    - "config/deployed/mainnet/tokens.zusdc.mainnet.json"
    - "config/deployed/mainnet/tokens.zbnb.mainnet.json"

# Alert control
alert:
  cooldown_seconds: 3600
