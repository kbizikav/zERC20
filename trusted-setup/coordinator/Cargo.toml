[package]
name = "trusted-setup-coordinator"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { workspace = true }
actix-governor = "0.6"
anyhow = { workspace = true }
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-grumpkin = { workspace = true }
ark-crypto-primitives = { workspace = true }
ark-poly-commit = { version = "0.5.0", default-features = false }
ark-serialize = { workspace = true }
arkworks-phase2 = { workspace = true }
aws-config = "1"
aws-sdk-s3 = "1"
dotenvy = { workspace = true }
env_logger = { workspace = true }
folding-schemes = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = [
    "sqlite",
    "runtime-tokio-native-tls",
    "macros",
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
] }
url = { workspace = true }
uuid = { workspace = true }
zkp = { path = "../../zkp" }
trusted-setup-common = { path = "../common" }

[features]
default = ["parallel"]
parallel = ["arkworks-phase2/parallel", "trusted-setup-common/parallel"]
