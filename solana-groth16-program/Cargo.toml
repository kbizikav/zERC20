[package]
name = "solana-groth16-program"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.3.0"
solana-groth16-verifier = { path = "../solana-groth16-verifier", default-features = false }
solana-client = { version = "2.3.0", optional = true }
solana-sdk = { version = "2.3.0", features = ["full"], optional = true }
solana-transaction-status = { version = "2.3.0", optional = true }
anyhow = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
solana-program-test = "2.3.0"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }

[features]
cli = [
    "solana-client",
    "solana-sdk",
    "solana-transaction-status",
    "anyhow",
    "clap",
]

[[bin]]
name = "send_verify"
path = "src/bin/send_verify.rs"
required-features = ["cli"]
